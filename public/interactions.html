<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sondages, prédictions, hype train - ElectrumOverlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/twitch-widgets.css">
    <style>
        body { padding: calc(12px * var(--w-scale)); font-size: calc(18px * var(--w-scale)); }
        #stack { display: flex; flex-direction: column; gap: 0.8em; }
    </style>
</head>
<body>
    <!-- Sondages, prédictions et hype train en cours. Source conseillée : 560×720.
         ?only=poll,prediction,hypetrain pour n'en garder que certains.
         Aussi disponibles comme éléments séparés dans l'éditeur de scène. -->
    <div id="stack"></div>

    <script src="js/config.js"></script>
    <script src="js/twitch-widgets.js"></script>
    <script src="js/widgets.js"></script>
    <script>
    (function () {
        const only = (Widgets.params.get('only') || 'poll,prediction,hypetrain').split(',').map((s) => s.trim());
        const ORDER = ['hypetrain', 'poll', 'prediction'];
        const cards = {};   // kind -> { el, hideTimer }

        function show(kind, data, phase) {
            if (!only.includes(kind) || !ORDER.includes(kind)) return;
            let card = cards[kind];
            if (!card) {
                const el = document.createElement('div');
                el.className = 'tw-card tw-enter';
                // Ordre stable : hype train, puis sondage, puis prédiction.
                const next = ORDER.slice(ORDER.indexOf(kind) + 1).map((k) => cards[k]?.el).find(Boolean);
                document.getElementById('stack').insertBefore(el, next || null);
                card = cards[kind] = { el };
            }
            clearTimeout(card.hideTimer);
            card.el.innerHTML = TwitchWidgets.html(kind, data, phase);
            if (phase === 'end') card.hideTimer = setTimeout(() => hide(kind), TwitchWidgets.LINGER[kind]);
        }

        function hide(kind) {
            const card = cards[kind];
            if (!card) return;
            card.el.classList.add('tw-leave');
            setTimeout(() => card.el.remove(), 400);
            delete cards[kind];
        }

        Widgets.on((message) => {
            if (message.type === 'interaction') show(message.kind, message.data, message.phase);
        });
        fetch('/api/interactions').then((r) => r.json()).then((state) => {
            for (const kind of ORDER) if (state[kind]) show(kind, state[kind], 'progress');
        }).catch(() => {});
        Widgets.start();
    })();
    </script>
</body>
</html>
