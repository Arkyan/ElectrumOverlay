<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Objectif - ElectrumOverlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/twitch-widgets.css">
    <style>
        body { padding: calc(12px * var(--w-scale)); font-size: calc(20px * var(--w-scale)); }
        #goal[hidden] { display: none; }
    </style>
</head>
<body>
    <!-- Objectif Twitch en cours (Gestionnaire de stream › Objectifs). Source conseillée : 900×140.
         Aussi disponible comme élément « Objectif Twitch » dans l'éditeur de scène. -->
    <div class="tw-card" id="goal" hidden></div>

    <script src="js/config.js"></script>
    <script src="js/twitch-widgets.js"></script>
    <script src="js/widgets.js"></script>
    <script>
    (function () {
        const card = document.getElementById('goal');
        let hideTimer = null;

        function render(goal, phase) {
            clearTimeout(hideTimer);
            card.hidden = !goal;
            if (!goal) return;
            card.innerHTML = TwitchWidgets.html('goal', goal, phase);
            // Objectif terminé sur Twitch : affiché encore un moment, puis retiré.
            if (phase === 'end') hideTimer = setTimeout(() => { card.hidden = true; }, TwitchWidgets.LINGER.goal);
        }

        Widgets.on((message) => {
            if (message.type === 'interaction' && message.kind === 'goal') render(message.data, message.phase);
        });
        fetch('/api/interactions').then((r) => r.json()).then((state) => render(state.goal, 'progress')).catch(() => {});
        Widgets.start();
    })();
    </script>
</body>
</html>
