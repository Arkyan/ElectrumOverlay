# Mises à jour des dépendances Rust (Cargo.lock) proposées chaque semaine par Dependabot,
# y compris les correctifs de sécurité.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Une seule pull request par semaine pour les mises à jour mineures et correctifs.
      rust:
        update-types: ["minor", "patch"]
