[workspace]
resolver = "2"
members = ["crates/electrum-core", "crates/electrum-server", "crates/electrum-deck", "src-tauri", "xtask"]
# `cargo test` / `cargo build` à la racine ne visent que le cœur (testable partout) ;
# l'app se lance avec `cargo tauri dev`.
default-members = ["crates/electrum-core", "crates/electrum-server", "crates/electrum-deck"]

[workspace.package]
version = "3.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
