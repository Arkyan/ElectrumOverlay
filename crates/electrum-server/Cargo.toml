[package]
name = "electrum-server"
description = "Serveur HTTP + WebSocket d'ElectrumOverlay (overlays OBS, API, pages)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4"] }
electrum-core = { path = "../electrum-core" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
aho-corasick = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.27"
futures-util = "0.3"
