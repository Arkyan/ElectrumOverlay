[package]
name = "electrum-overlay"
description = "ElectrumOverlay (version Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "electrum_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
electrum-core = { path = "../crates/electrum-core" }
electrum-server = { path = "../crates/electrum-server" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
sys-locale = "0.3"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }

# Capture globale clavier/souris (affichage des touches) : Windows uniquement, comme la version
# Electron (uiohook).
[target.'cfg(windows)'.dependencies]
rdev = "0.5"
