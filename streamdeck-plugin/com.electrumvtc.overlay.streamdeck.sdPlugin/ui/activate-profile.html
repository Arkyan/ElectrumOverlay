<!DOCTYPE html>
<html>

<head lang="fr">
    <title>Activer un profil</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Profil">
        <sdpi-select id="profileSelect" setting="profileId" placeholder="Choisis un profil">
        </sdpi-select>
    </sdpi-item>
    <p id="profileError" style="display:none; color: #f87171; font-size: 12px;"></p>

    <details>
        <summary>Avancé</summary>
        <sdpi-item label="Hôte">
            <sdpi-textfield id="hostField" setting="host" placeholder="localhost"></sdpi-textfield>
        </sdpi-item>
        <sdpi-item label="Port">
            <sdpi-textfield id="portField" setting="port" placeholder="8080"></sdpi-textfield>
        </sdpi-item>
    </details>

    <script>
        // La liste des profils vient directement d'ElectrumOverlay (comme une page web normale) —
        // pas besoin de round-trip par le backend du plugin pour ça.
        async function loadProfiles() {
            const select = document.getElementById('profileSelect');
            const errorEl = document.getElementById('profileError');
            const host = document.getElementById('hostField').value || 'localhost';
            const port = document.getElementById('portField').value || '8080';

            try {
                const res = await fetch(`http://${host}:${port}/api/profiles`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                const currentValue = select.value;
                select.innerHTML = data.profiles
                    .map((p) => `<option value="${p.id}">${p.name}${p.id === data.activeId ? ' (actif)' : ''}</option>`)
                    .join('');
                if (currentValue) select.value = currentValue;

                errorEl.style.display = 'none';
            } catch (error) {
                errorEl.textContent = 'Impossible de contacter ElectrumOverlay (serveur démarré ?)';
                errorEl.style.display = '';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfiles);
        document.getElementById('hostField')?.addEventListener('change', loadProfiles);
        document.getElementById('portField')?.addEventListener('change', loadProfiles);
    </script>
</body>

</html>
